<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WestJet Take-off Safety Video</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            /* Soft moving liquid silver background */
            background: linear-gradient(-45deg, #f8fafc, #e2e8f0, #cbd5e1, #f1f5f9);
            background-size: 400% 400%;
            animation: liquidFlow 18s ease infinite;
            background-attachment: fixed;
            padding: 24px;
        }

        @keyframes liquidFlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Bright, high-gloss liquid glass pane */
        .light-glass-card {
            background: rgba(255, 255, 255, 0.35); 
            backdrop-filter: blur(30px) saturate(160%);
            -webkit-backdrop-filter: blur(30px) saturate(160%);
            border-radius: 28px;
            /* Polished structural highlight edge */
            border-top: 1.5px solid rgba(255, 255, 255, 0.6);
            border-left: 1.5px solid rgba(255, 255, 255, 0.4);
            border-right: 1px solid rgba(255, 255, 255, 0.2);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding: 44px;
            max-width: 820px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 50px -12px rgba(100, 116, 139, 0.15),
                        inset 0 1px 0 rgba(255, 255, 255, 0.4);
        }

        h1 {
            color: #334155;
            font-size: 1.8rem;
            margin-bottom: 28px;
            font-weight: 600;
            letter-spacing: -0.4px;
        }

        /* Clean, borderless video frame */
        video {
            max-width: 100%;
            width: 100%;
            border-radius: 16px;
            border: none; /* Completely removes the border outline */
            box-shadow: none; /* Removes the drop shadow to keep it totally clean */
            background-color: #000000;
            outline: none;
            display: block; /* Prevents tiny layout gaps under the video element */
        }
    </style>
</head>
<body>

    <div class="light-glass-card">
        <h1>Westjet Take-off Safety Video</h1>

        <!-- Stream-only configuration block -->
        <video controls controlsList="nodownload" oncontextmenu="return false;">
            <source src="EsteeC_WestJet%20Take-off%20Safety%20Video.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>
    </div>

</body>
</html>
