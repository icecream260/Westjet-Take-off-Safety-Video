<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WestJet Take-off Safety Video</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            /* Chill, clean off-white to soft silver-grey gradient */
            background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 50%, #e2e8f0 100%);
            background-attachment: fixed;
            padding: 24px;
        }
        /* Pure frost minimal glass container */
        .chill-glass-card {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(20px) saturate(140%);
            -webkit-backdrop-filter: blur(20px) saturate(140%);
            border-radius: 20px;
            /* Fine, bright glass edge to make it pop subtly from the gradient */
            border: 1px solid rgba(255, 255, 255, 0.7);
            padding: 40px;
            max-width: 800px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 30px rgba(148, 163, 184, 0.12), 
                        0 1px 3px rgba(148, 163, 184, 0.04);
        }
        h1 {
            color: #334155; /* Soft slate charcoal instead of harsh black */
            font-size: 1.8rem;
            margin-bottom: 28px;
            font-weight: 500;
            letter-spacing: -0.4px;
        }
        /* Elegant video player canvas */
        video {
            max-width: 100%;
            width: 100%;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 12px 28px rgba(15, 23, 42, 0.08);
            background-color: #000000;
            outline: none;
        }
        /* Minimalist translucent system-vibe button */
        .download-btn {
            display: inline-block;
            margin-top: 32px;
            padding: 11px 26px;
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            color: #475569;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 500;
            font-size: 0.9rem;
            border: 1px solid rgba(255, 255, 255, 0.8);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 2px 6px rgba(148, 163, 184, 0.08);
        }
        .download-btn:hover {
            background: rgba(255, 255, 255, 0.9);
            border-color: #ffffff;
            color: #1e293b;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(148, 163, 184, 0.15);
        }
        .download-btn:active {
            transform: translateY(0);
            background: rgba(255, 255, 255, 0.4);
        }
    </style>
</head>
<body>

    <div class="chill-glass-card">
        <h1>Westjet Take-off Safety Video</h1>

        <!-- Embedded Live Streaming Video Player -->
        <video controls>
            <source src="EsteeC_WestJet%20Take-off%20Safety%20Video.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>

        <br>
        
        <!-- Clean Download Action Button -->
        <a href="EsteeC_WestJet%20Take-off%20Safety%20Video.mp4" download class="download-btn">
            Download Video
        </a>
    </div>

</body>
</html>
