<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WestJet Take-off Safety Video</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            /* Deeper, chill slate-grey background gradient to make the glass pop */
            background: linear-gradient(135deg, #e2e8f0 0%, #cbd5e1 50%, #94a3b8 100%);
            background-attachment: fixed;
            padding: 24px;
        }
        /* Smokey, light-ish grey glass container with high frosted blur */
        .smokey-glass-card {
            background: rgba(30, 41, 59, 0.45); /* Translucent charcoal grey overlay */
            backdrop-filter: blur(25px) saturate(130%);
            -webkit-backdrop-filter: blur(25px) saturate(130%);
            border-radius: 24px;
            /* Sleek structural highlight border */
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 40px;
            max-width: 800px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 40px rgba(15, 23, 42, 0.15),
                        inset 0 1px 1px rgba(255, 255, 255, 0.1);
        }
        h1 {
            color: #ffffff; /* White title stands out beautifully on dark glass */
            font-size: 1.8rem;
            margin-bottom: 28px;
            font-weight: 600;
            letter-spacing: -0.4px;
            text-shadow: 0 1px 2px rgba(0,0,0,0.2);
        }
        /* Elegant video player canvas highlighted by the dark background */
        video {
            max-width: 100%;
            width: 100%;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 16px 36px rgba(0, 0, 0, 0.35);
            background-color: #000000;
            outline: none;
        }
        /* Crisp, vivid Apple-style blue system button */
        .download-btn {
            display: inline-block;
            margin-top: 32px;
            padding: 12px 32px;
            background: #007aff; /* Apple standard system blue */
            color: #ffffff;
            text-decoration: none;
            border-radius: 980px; /* Clean pill shape */
            font-weight: 600;
            font-size: 0.95rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 12px rgba(0, 122, 255, 0.3);
        }
        .download-btn:hover {
            background: #0066cc; /* Deeper blue on hover */
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(0, 122, 255, 0.45);
        }
        .download-btn:active {
            transform: translateY(0);
            background: #0055aa;
            box-shadow: 0 2px 6px rgba(0, 122, 255, 0.2);
        }
    </style>
</head>
<body>

    <div class="smokey-glass-card">
        <h1>Westjet Take-off Safety Video</h1>

        <!-- Embedded Live Streaming Video Player -->
        <video controls>
            <source src="EsteeC_WestJet%20Take-off%20Safety%20Video.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>

        <br>
        
        <!-- Vibrant Blue Download Action Button -->
        <a href="EsteeC_WestJet%20Take-off%20Safety%20Video.mp4" download class="download-btn">
            Download Video
        </a>
    </div>

</body>
</html>
