<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WestJet Take-off Safety Video</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            /* Animated liquid background to warp through the glass */
            background: linear-gradient(-45deg, #cbd5e1, #94a3b8, #64748b, #cbd5e1);
            background-size: 400% 400%;
            animation: liquidFlow 15s ease infinite;
            background-attachment: fixed;
            padding: 24px;
        }

        /* Ambient liquid background movement */
        @keyframes liquidFlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* High-Gloss Liquid Glass Container */
        .liquid-glass-card {
            /* Translucent layer that pulls colors dynamically from behind it */
            background: rgba(30, 41, 59, 0.4); 
            backdrop-filter: blur(35px) saturate(220%);
            -webkit-backdrop-filter: blur(35px) saturate(220%);
            border-radius: 28px;
            /* Fine reflection boundary to simulate a liquid mercury shell */
            border-top: 1.5px solid rgba(255, 255, 255, 0.3);
            border-left: 1.5px solid rgba(255, 255, 255, 0.2);
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding: 44px;
            max-width: 820px;
            width: 100%;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(15, 23, 42, 0.25),
                        inset 0 1px 0 rgba(255, 255, 255, 0.15);
        }

        h1 {
            color: #ffffff;
            font-size: 1.8rem;
            margin-bottom: 28px;
            font-weight: 600;
            letter-spacing: -0.4px;
            text-shadow: 0 1px 3px rgba(0,0,0,0.15);
        }

        /* Sharp video canvas contrasted against the fluid card */
        video {
            max-width: 100%;
            width: 100%;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            background-color: #000000;
            outline: none;
        }

        /* Vivid Electric-Blue Accent Button */
        .download-btn {
            display: inline-block;
            margin-top: 36px;
            padding: 12px 36px;
            background: #007aff;
            color: #ffffff;
            text-decoration: none;
            border-radius: 980px;
            font-weight: 600;
            font-size: 0.95rem;
            border: 1px solid rgba(255, 255, 255, 0.15);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 14px rgba(0, 122, 255, 0.4);
        }

        .download-btn:hover {
            background: #0066cc;
            transform: translateY(-2px) scale(1.01);
            box-shadow: 0 8px 20px rgba(0, 122, 255, 0.55);
        }

        .download-btn:active {
            transform: translateY(0) scale(0.99);
            background: #0055aa;
            box-shadow: 0 2px 6px rgba(0, 122, 255, 0.3);
        }
    </style>
</head>
<body>

    <div class="liquid-glass-card">
        <h1>Westjet Take-off Safety Video</h1>

        <!-- Embedded Live Streaming Video Player -->
        <video controls>
            <source src="EsteeC_WestJet%20Take-off%20Safety%20Video.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>

        <br>
        
        <!-- Action Button -->
        <a href="EsteeC_WestJet%20Take-off%20Safety%20Video.mp4" download class="download-btn">
            Download Video
        </a>
    </div>

</body>
</html>
